services:
  postgres:
    image: postgres:16
    container_name: orb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: orb_db
      POSTGRES_USER: orb_user
      POSTGRES_PASSWORD: orb_password
    ports:
      - "5432:5432"
    volumes:
      - orb_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orb_user -d orb_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  orb_postgres_data: